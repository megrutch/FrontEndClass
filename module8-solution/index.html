<!doctype html>
<html lang="en" ng-app="NarrowItDownApp">
  <head>
    <title>Narrow Down Your Menu Choice</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="styles/bootstrap.min.css">
    <link rel="stylesheet" href="styles/styles.css">
  </head>
<body>
   <div class="container">
    <h1>Narrow Down Your Chinese Menu Choice</h1>

    <div ng-controller="NarrowItDownController as narrowC">
    <div class="form-group">
      <input type="text" placeholder="search term" class="form-control">
    </div>
    <div class="form-group narrow-button">
      <button class="btn btn-primary" ng-click="narrowC.searchMenuItems(searchTerm)">Narrow It Down For Me!</button>
    </div>
    
    <found-items found-items="narrowC.found" on-remove="...."></found-items>
    </div>
  </div>
<script src="angular.min.js"></script>
<script src="app.js"></script>
</body>
</html>
